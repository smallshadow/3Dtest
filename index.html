<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 產品展示 - OLIVMEW 動態尺寸</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f4f4f4; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        model-viewer {
            width: 100%; height: 80%;
            background-color: #ffffff;
            --poster-color: transparent;
        }

        .dim {
            background: transparent; border: none; 
            color: #888; /* 修改：文字顏色改為與線條一致的 #888 */
            font-size: 18px;
            font-family: "Helvetica Neue", Arial, sans-serif; 
            font-weight: bold; 
            position: absolute; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease-out; transition-delay: 0.4s;
            display: block !important;
        }

        .dimensionLineContainer {
            pointer-events: none; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .dimensionLine {
            stroke: #888; 
            stroke-width: 2.5; 
            stroke-linecap: round;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.8s cubic-bezier(1, 0, 0.2, 1);
        }

        .show-dim .dim { opacity: 1; visibility: visible; }
        .line-grow { stroke-dashoffset: 0 !important; }

        .controls { padding: 20px; text-align: center; }
        .dim-button {
            background-color: #000; color: white; border: none; padding: 10px 20px;
            cursor: pointer; font-size: 14px; letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="toggle-dim" class="dim-button">顯示尺寸標註</button>
    </div>
    <model-viewer 
        id="product-model"
        src="OLIVMEW04.glb" 
        environment-image="HDR.hdr"
        style="background-color:#F7F5F4"
        exposure="0.9"
        camera-orbit="0deg 75deg 0.25m"
        field-of-view="30deg"
        min-camera-orbit="auto auto 0.25m"
        max-camera-orbit="auto auto 0.25m"
        camera-controls auto-rotate rotation-per-second="30deg"
        touch-action="pan-y">
        
        <button slot="hotspot-x-start" style="display:none"></button>
        <button slot="hotspot-x-end" style="display:none"></button>
        <button slot="hotspot-y-start" style="display:none"></button>
        <button slot="hotspot-y-end" style="display:none"></button>
        <button slot="hotspot-z-start" style="display:none"></button>
        <button slot="hotspot-z-end" style="display:none"></button>

        <button slot="hotspot-x-t1" style="display:none"></button>
        <button slot="hotspot-x-t2" style="display:none"></button>
        <button slot="hotspot-y-t1" style="display:none"></button>
        <button slot="hotspot-y-t2" style="display:none"></button>
        <button slot="hotspot-z-t1" style="display:none"></button>
        <button slot="hotspot-z-t2" style="display:none"></button>

        <button id="dim-x" slot="hotspot-dim-x" class="dim"></button>
        <button id="dim-y" slot="hotspot-dim-y" class="dim"></button>
        <button id="dim-z" slot="hotspot-dim-z" class="dim"></button>

        <svg id="dimLines" class="dimensionLineContainer">
            <line id="x-a" class="dimensionLine"></line><line id="x-b" class="dimensionLine"></line>
            <line id="x-t1" class="dimensionLine"></line><line id="x-t2" class="dimensionLine"></line>
            <line id="y-a" class="dimensionLine"></line><line id="y-b" class="dimensionLine"></line>
            <line id="y-t1" class="dimensionLine"></line><line id="y-t2" class="dimensionLine"></line>
            <line id="z-a" class="dimensionLine"></line><line id="z-b" class="dimensionLine"></line>
            <line id="z-t1" class="dimensionLine"></line><line id="z-t2" class="dimensionLine"></line>
        </svg>
    </model-viewer>
</div>

<script>
    const modelViewer = document.querySelector("#product-model");
    const toggleBtn = document.querySelector("#toggle-dim");
    const allLines = document.querySelectorAll(".dimensionLine");

    toggleBtn.addEventListener('click', () => {
        const isShowing = modelViewer.classList.toggle('show-dim');
        toggleBtn.textContent = isShowing ? "隱藏尺寸標註" : "顯示尺寸標註";
        
        if (isShowing) {
            modelViewer.autoRotate = false;
            // 保持你上次調整的 -145deg 視角
            modelViewer.cameraOrbit = "-145deg 75deg 0.25m";
            
            setTimeout(() => allLines.forEach(line => line.classList.add('line-grow')), 50);
        } else {
            modelViewer.autoRotate = true;
            allLines.forEach(line => line.classList.remove('line-grow'));
        }
    });

    function drawLineBetweenHotspots(line, p1Name, p2Name) {
        const h1 = modelViewer.queryHotspot(p1Name);
        const h2 = modelViewer.queryHotspot(p2Name);
        if (h1 && h2 && h1.canvasPosition && h2.canvasPosition) {
            line.setAttribute('x1', h1.canvasPosition.x);
            line.setAttribute('y1', h1.canvasPosition.y);
            line.setAttribute('x2', h2.canvasPosition.x);
            line.setAttribute('y2', h2.canvasPosition.y);
        }
    }

    function drawDimensionAxis(lineA, lineB, tick1, tick2, start, end, t1, t2) {
        const hS = modelViewer.queryHotspot(start);
        const hE = modelViewer.queryHotspot(end);
        
        if (hS?.canvasPosition && hE?.canvasPosition) {
            const x1 = hS.canvasPosition.x, y1 = hS.canvasPosition.y;
            const x2 = hE.canvasPosition.x, y2 = hE.canvasPosition.y;
            const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.sqrt(dx*dx + dy*dy);
            
            const gapPixels = 40; 
            const gapRatio = gapPixels / len;

            lineA.setAttribute('x1', x1); lineA.setAttribute('y1', y1);
            lineA.setAttribute('x2', midX - dx * gapRatio); lineA.setAttribute('y2', midY - dy * gapRatio);
            
            lineB.setAttribute('x1', midX + dx * gapRatio); lineB.setAttribute('y1', midY + dy * gapRatio);
            lineB.setAttribute('x2', x2); lineB.setAttribute('y2', y2);
        }

        drawLineBetweenHotspots(tick1, start, t1);
        drawLineBetweenHotspots(tick2, end, t2);
    }

    const render = () => {
        drawDimensionAxis(document.querySelector("#x-a"), document.querySelector("#x-b"), document.querySelector("#x-t1"), document.querySelector("#x-t2"), 'hotspot-x-start', 'hotspot-x-end', 'hotspot-x-t1', 'hotspot-x-t2');
        drawDimensionAxis(document.querySelector("#y-a"), document.querySelector("#y-b"), document.querySelector("#y-t1"), document.querySelector("#y-t2"), 'hotspot-y-start', 'hotspot-y-end', 'hotspot-y-t1', 'hotspot-y-t2');
        drawDimensionAxis(document.querySelector("#z-a"), document.querySelector("#z-b"), document.querySelector("#z-t1"), document.querySelector("#z-t2"), 'hotspot-z-start', 'hotspot-z-end', 'hotspot-z-t1', 'hotspot-z-t2');
        requestAnimationFrame(render);
    };

    modelViewer.addEventListener('load', () => {
        const center = modelViewer.getBoundingBoxCenter();
        const size = modelViewer.getDimensions();
        const x2 = size.x / 2, y2 = size.y / 2, z2 = size.z / 2;
        
        const offset = 0.008; 
        const tickSize = 0.003; 

        const xS = { x: center.x - x2, y: center.y - y2 - offset, z: center.z - z2 - offset };
        const xE = { x: center.x + x2, y: center.y - y2 - offset, z: center.z - z2 - offset };
        const xT1 = { x: xS.x, y: xS.y, z: xS.z + tickSize };
        const xT2 = { x: xE.x, y: xE.y, z: xE.z + tickSize };

        const yS = { x: center.x - x2 - offset, y: center.y - y2, z: center.z + z2 + offset };
        const yE = { x: center.x - x2 - offset, y: center.y + y2, z: center.z + z2 + offset };
        const yT1 = { x: yS.x + tickSize, y: yS.y, z: yS.z };
        const yT2 = { x: yE.x + tickSize, y: yE.y, z: yE.z };

        const zS = { x: center.x - x2 - offset, y: center.y - y2 - offset, z: center.z + z2 };
        const zE = { x: center.x - x2 - offset, y: center.y - y2 - offset, z: center.z - z2 };
        const zT1 = { x: zS.x + tickSize, y: zS.y, z: zS.z };
        const zT2 = { x: zE.x + tickSize, y: zE.y, z: zE.z };

        const points = {
            'hotspot-x-start': xS, 'hotspot-x-end': xE, 'hotspot-x-t1': xT1, 'hotspot-x-t2': xT2,
            'hotspot-y-start': yS, 'hotspot-y-end': yE, 'hotspot-y-t1': yT1, 'hotspot-y-t2': yT2,
            'hotspot-z-start': zS, 'hotspot-z-end': zE, 'hotspot-z-t1': zT1, 'hotspot-z-t2': zT2
        };
        Object.keys(points).forEach(name => {
            modelViewer.updateHotspot({ name, position: `${points[name].x} ${points[name].y} ${points[name].z}` });
        });

        const setLabel = (id, text, pA, pB) => {
            const el = document.querySelector(id);
            el.textContent = text;
            modelViewer.updateHotspot({ name: el.slot, position: `${(pA.x+pB.x)/2} ${(pA.y+pB.y)/2} ${(pA.z+pB.z)/2}` });
        };
        setLabel('#dim-x', "1.3cm", xS, xE);
        setLabel('#dim-y', "1.4cm", yS, yE);
        setLabel('#dim-z', "0.2cm", zS, zE);

        requestAnimationFrame(render);
    });
</script>

</body>
</html>
