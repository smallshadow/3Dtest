<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 產品展示 - OLIVMEW 自然遮擋修正</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f4f4f4; }
        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            position: relative;
        }
        
        model-viewer {
            width: 100%; height: 80%;
            background-color: transparent;
            --poster-color: transparent;
            position: relative;
            z-index: 2; 
            pointer-events: auto;
        }

        .bottom-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        .dim {
            background: transparent; border: none; 
            color: #888; 
            font-size: 15px;
            font-family: "Helvetica Neue", Arial, sans-serif; 
            font-weight: 500; 
            position: absolute; transform: translate(-50%, -50%);
            opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease-out;
        }

        .show-dim .dim.visible { opacity: 1; visibility: visible; }
        .show-dim .dimensionLine { stroke-dashoffset: 0; }
        
        .dimensionLineContainer {
            pointer-events: none; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .dimensionLine {
            stroke: #888; 
            stroke-width: 2; 
            stroke-linecap: round;
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.8s cubic-bezier(1, 0, 0.2, 1), opacity 0.3s;
        }

        .controls { 
            padding: 20px; 
            text-align: center;
            position: relative;
            z-index: 100;
        }
        .dim-button {
            background-color: #000; color: white; border: none; padding: 10px 20px;
            cursor: pointer; font-size: 14px; letter-spacing: 1px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="toggle-dim" class="dim-button">顯示尺寸標註</button>
    </div>
    
    <model-viewer 
        id="product-model"
        src="OLIVMEW04.glb" 
        environment-image="HDR.hdr"
        style="background-color: transparent;"
        exposure="0.9"
        camera-orbit="-145deg 75deg 0.25m" 
        field-of-view="30deg"
        min-camera-orbit="auto auto 0.25m"
        max-camera-orbit="auto auto 0.25m"
        camera-controls
        touch-action="pan-y">
        
        <div slot="hotspot-y-start"></div>
        <div slot="hotspot-y-end"></div>
        <div slot="hotspot-z-start"></div>
        <div slot="hotspot-z-end"></div>
        <div slot="hotspot-y-t1"></div>
        <div slot="hotspot-y-t2"></div>
        <div slot="hotspot-z-t1"></div>
        <div slot="hotspot-z-t2"></div>
        <div slot="hotspot-dim-y"></div>
        <div slot="hotspot-dim-z"></div>
    </model-viewer>

    <div class="bottom-layer" id="ui-layer">
        <div id="dim-y" class="dim visible">14mm</div>
        <div id="dim-z" class="dim visible">2mm</div>

        <svg id="dimLines" class="dimensionLineContainer">
            <line id="y-a" class="dimensionLine"></line>
            <line id="y-t1" class="dimensionLine"></line>
            <line id="y-t2" class="dimensionLine"></line>
            <line id="z-a" class="dimensionLine"></line>
            <line id="z-t1" class="dimensionLine"></line>
            <line id="z-t2" class="dimensionLine"></line>
        </svg>
    </div>
</div>

<script>
    const modelViewer = document.querySelector("#product-model");
    const toggleBtn = document.querySelector("#toggle-dim");
    const uiLayer = document.querySelector("#ui-layer");

    toggleBtn.addEventListener('click', () => {
        const isShowing = uiLayer.classList.toggle('show-dim');
        toggleBtn.textContent = isShowing ? "隱藏尺寸標註" : "顯示尺寸標註";
        if (isShowing) { modelViewer.cameraOrbit = "-145deg 75deg 0.25m"; }
    });

    function updateElementPosition(el, hotspotName) {
        const hotspot = modelViewer.queryHotspot(hotspotName);
        if (hotspot && hotspot.canvasPosition) {
            el.style.left = `${hotspot.canvasPosition.x}px`;
            el.style.top = `${hotspot.canvasPosition.y}px`;
        }
    }

    function drawLineBetweenHotspots(line, p1Name, p2Name) {
        const h1 = modelViewer.queryHotspot(p1Name);
        const h2 = modelViewer.queryHotspot(p2Name);
        if (h1 && h2 && h1.canvasPosition && h2.canvasPosition) {
            line.setAttribute('x1', h1.canvasPosition.x);
            line.setAttribute('y1', h1.canvasPosition.y);
            line.setAttribute('x2', h2.canvasPosition.x);
            line.setAttribute('y2', h2.canvasPosition.y);
        }
    }

    const render = () => {
        updateElementPosition(document.querySelector("#dim-y"), 'hotspot-dim-y');
        updateElementPosition(document.querySelector("#dim-z"), 'hotspot-dim-z');
        drawLineBetweenHotspots(document.querySelector("#y-a"), 'hotspot-y-start', 'hotspot-y-end');
        drawLineBetweenHotspots(document.querySelector("#y-t1"), 'hotspot-y-start', 'hotspot-y-t1');
        drawLineBetweenHotspots(document.querySelector("#y-t2"), 'hotspot-y-end', 'hotspot-y-t2');
        drawLineBetweenHotspots(document.querySelector("#z-a"), 'hotspot-z-start', 'hotspot-z-end');
        drawLineBetweenHotspots(document.querySelector("#z-t1"), 'hotspot-z-start', 'hotspot-z-t1');
        drawLineBetweenHotspots(document.querySelector("#z-t2"), 'hotspot-z-end', 'hotspot-z-t2');
        requestAnimationFrame(render);
    };

    modelViewer.addEventListener('load', () => {
        const center = modelViewer.getBoundingBoxCenter();
        const size = modelViewer.getDimensions();
        const offset = 0.008; 
        const tickSize = 0.003; 
        
        // --- 1. 調整整體標註下移量 ---
        const verticalAdjustment = 0.022; 

        // --- 2. 調整文字與線段的間距 (單位：米) ---
        // yLabelXOffset: Y 軸文字往左推開的距離
        const yLabelXOffset = -0.012; 
        // zLabelXOffset: Z 軸文字往左推開的距離 (讓它不與 Z 軸線重疊)
        const zLabelXOffset = -0.012; 

        // Y 軸標註點位計算
        const yBaseY = center.y - size.y/2 - verticalAdjustment;
        const yS = { x: center.x - size.x/2 - offset, y: yBaseY, z: center.z + size.z/2 + offset };
        const yE = { x: center.x - size.x/2 - offset, y: yBaseY + size.y, z: center.z + size.z/2 + offset };

        // Z 軸標註點位計算
        const zBaseY = center.y - size.y/2 - offset - verticalAdjustment;
        const zS = { x: center.x - size.x/2 - offset, y: zBaseY, z: center.z + size.z/2 };
        const zE = { x: center.x - size.x/2 - offset, y: zBaseY, z: center.z - size.z/2 };

        const points = {
            'hotspot-y-start': yS, 
            'hotspot-y-end': yE, 
            'hotspot-y-t1': { ...yS, x: yS.x + tickSize }, 
            'hotspot-y-t2': { ...yE, x: yE.x + tickSize },
            'hotspot-z-start': zS, 
            'hotspot-z-end': zE, 
            'hotspot-z-t1': { ...zS, x: zS.x + tickSize }, 
            'hotspot-z-t2': { ...zE, x: zE.x + tickSize }
        };
        
        Object.keys(points).forEach(name => {
            modelViewer.updateHotspot({ name, position: `${points[name].x} ${points[name].y} ${points[name].z}` });
        });

        // --- 設定文字標籤位置中心點 (現在都採用 X 軸水平位移) ---
        
        // Y 軸標註文字
        modelViewer.updateHotspot({ 
            name: 'hotspot-dim-y', 
            position: `${yS.x + yLabelXOffset} ${yBaseY + size.y/2} ${yS.z}` 
        });
        
        // Z 軸標註文字 (Y 座標恢復平行，X 座標往左移)
        modelViewer.updateHotspot({ 
            name: 'hotspot-dim-z', 
            position: `${zS.x + zLabelXOffset} ${zBaseY} ${center.z}` 
        });

        requestAnimationFrame(render);
    });
</script>

</body>
</html>
