<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 產品展示測試</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f4f4f4; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* 3D 視窗大小設定 */
        model-viewer {
            width: 100%;
            height: 80%;
            background-color: #ffffff;
            --poster-color: transparent;
        }

        .controls {
            padding: 20px;
            text-align: center;
        }

        .ar-button {
            background-color: #000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <model-viewer 
        id="product-model"
        src="flower.glb" 
        ios-src="" 
        alt="3D 產品模型"
        shadow-intensity="1.5" 
        shadow-softness="1"
        camera-controls 
        auto-rotate 
        rotation-per-second="30deg"
        touch-action="pan-y"
        ar
        ar-modes="webxr scene-viewer quick-look"
        exposure="1.2"
        environment-image="neutral">
        
        <button slot="ar-button" class="ar-button">
            在空間中預覽 (AR)
        </button>
    </model-viewer>

    <div class="controls">
        <h2>測試用火雞</h2>
        <p>3D 互動展示測試樣板。</p>
    </div>
</div>

<script>
    // 這裡可以加入互動邏輯，例如點擊按鈕更換顏色
    const modelViewer = document.querySelector("#product-model");
    
    // 範例：如果模型加載完成，控制台打印訊息
    modelViewer.addEventListener('load', () => {
        console.log("3D 模型已成功加載！");
    });
</script>

</body>
</html>
